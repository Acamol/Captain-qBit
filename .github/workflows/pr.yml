name: PR

on:
  pull_request:
  # Also on the long-lived branches: a pull_request run only proves the merge preview was green
  # against the base at that moment. Direct pushes are allowed here, and a PR that passed against
  # an older base can still break the branch it lands on.
  push:
    branches: [develop, main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check code style
        run: ./gradlew spotlessCheck

      - name: Build and test
        run: ./gradlew assembleDebug test

      - name: Lint
        run: ./gradlew :app:lintDebug
